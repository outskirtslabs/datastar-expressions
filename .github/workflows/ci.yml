# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
---
name: ci
on:
  push:
    branches:
      - main
  pull_request:
jobs:
  build-clojure:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # tag: v4.22

      - name: Setup java 21 as default java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> $GITHUB_ENV
          echo "$JAVA_HOME_21_X64/bin" >> $GITHUB_PATH
        shell: bash

      - name: Install clojure + tools
        uses: DeLaGuardo/setup-clojure@02f5a82b79a547523e664fe8a7a32ea14884d7b2 # tag 13.2
        with:
          cli: latest
          bb: latest
          cljfmt: latest
          clj-kondo: latest

      - name: Cache clojure dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # tag: v4.2.3
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: cljdeps-${{ hashFiles('**/deps.edn') }}
          restore-keys: cljdeps-

      - name: Run test suite + linters
        run: bb ci
